const STATUS_MAP = { '非限制':'s-unrestricted', '质检':'s-inspection', '冻结':'s-frozen' };

function searchInventory() {
  const plant = document.getElementById('invSearchPlant').value;
  const bin = document.getElementById('invSearchBin').value;
  const mrp = document.getElementById('invSearchMRP').value;
  const codeKw = document.getElementById('invSearchCode').value.trim().toLowerCase();

  if (!plant) {
    document.getElementById('invResultList').innerHTML = '<div class="empty-msg"><span class="empty-icon"><svg viewBox="0 0 24 24" width="36" height="36"><path d="M3 9l9-5 9 5-9 5-9-5z" fill="none" stroke="var(--cds-gray-30)" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 9v6l9 5 9-5V9" fill="none" stroke="var(--cds-gray-30)" stroke-width="1.5" stroke-linejoin="round"/></svg></span>请选择工厂</div>';
    document.getElementById('invCountBar').innerHTML = '';
    return;
  }

  let data = inventoryData.filter(d => d.plant === plant);
  if (bin) data = data.filter(d => d.storageDesc === bin || (d.storageBin||'').includes(bin));
  if (mrp) data = data.filter(d => (d.mrpController||'A06-其他') === mrp);
  if (codeKw) {
    data = data.filter(d =>
      d.code.toLowerCase().includes(codeKw) ||
      d.name.toLowerCase().includes(codeKw) ||
      d.spec.toLowerCase().includes(codeKw)
    );
  }

  // Filter out zero-stock items
  data = data.filter(d => d.qty > 0);

  // Safety stock warning logic for qty color
  const qtyClass = (d) => {
    if (d.qty <= 0) return 'qty-empty';
    if (d.qty < d.safetyStock) return 'qty-warn';
    return 'qty-ok';
  };

  // Warning count
  const lowCount = data.filter(d => d.qty > 0 && d.qty < d.safetyStock).length;
  let countHtml = `<span>${data.length} 条物料</span>`;
  if (lowCount) {
    countHtml += `<span style="color:var(--cds-red-60);">${lowCount} 低库存</span>`;
  }
  document.getElementById('invCountBar').innerHTML = countHtml;

  const STATUS_CLS = { '非限制': 's-unrestricted', '质检': 's-inspection', '冻结': 's-frozen' };

  document.getElementById('invResultList').innerHTML = data.length === 0 ?
    '<div class="empty-msg"><span class="empty-icon"><svg viewBox="0 0 24 24" width="36" height="36"><path d="M3 9l9-5 9 5-9 5-9-5z" fill="none" stroke="var(--cds-gray-30)" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 9v6l9 5 9-5V9" fill="none" stroke="var(--cds-gray-30)" stroke-width="1.5" stroke-linejoin="round"/></svg></span>未找到匹配的库存物料</div>' :
    data.map(d => {
      const qtyCls = qtyClass(d);
      const itemCls = d.qty < d.safetyStock ? ' inv-low' : '';
      const loc = d.storageDesc || '';
      const statusCls = STATUS_CLS[d.invStatus] || '';
      return `<div class="inv-list-item${itemCls}" onclick="showInvDetail('${d.id}')">
        <div class="inv-row">
          <span class="inv-name-text">${d.name}</span>
          <span class="inv-status-badge ${statusCls}">${d.invStatus}</span>
        </div>
        <div class="inv-row">
          <span class="inv-code">${d.code}</span>
        </div>
        <div class="inv-row">
          <span class="inv-location">${loc}</span>
          <span class="inv-qty-info"><span class="inv-qty ${qtyCls}">${d.qty}</span><span class="inv-unit">${d.unit}</span></span>
        </div>
      </div>`;
    }).join('');
}

function showInvDetail(id) {
  const d = inventoryData.find(i => i.id === id);
  if (!d) return;
  document.getElementById('invDetailView').style.display = 'block';
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('invResultList').style.display = 'none';
  document.getElementById('invCountBar').style.display = 'none';
  document.getElementById('invSearchBar').style.display = 'none';

  document.getElementById('invDetailView').innerHTML = `
    <div style="text-align:center;padding:20px 16px 8px;background:var(--cds-white);margin:0 16px 1px;">
      <div style="font-size:20px;font-weight:400;margin-bottom:4px;">${d.name}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cds-text-secondary);">${d.code}</div>
      <div style="display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:12px;">
        <span style="font-size:36px;font-weight:300;">${d.qty}</span>
        <span style="font-size:14px;color:var(--cds-text-secondary);">${d.unit}</span>
        <span class="inv-status-badge ${STATUS_MAP[d.invStatus] || ''}" style="font-size:13px;padding:4px 12px;">${d.invStatus}</span>
      </div>
    </div>
    <div class="info-section" style="margin-top:0;">
      <div class="info-section-title">基本信息</div>
      <div class="info-section-body">
        <div class="cds-data-row"><span class="cds-data-label">物料编码</span><span class="cds-data-value mono">${d.code}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">规格型号</span><span class="cds-data-value">${d.spec}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">工厂</span><span class="cds-data-value mono">${d.plant}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">MRP控制者</span><span class="cds-data-value">${d.mrpController || 'A06-其他'}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">安全库存</span><span class="cds-data-value">${d.safetyStock} ${d.unit}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">单价</span><span class="cds-data-value mono">¥${d.unitPrice.toLocaleString()}</span></div>
      </div>
    </div>
    <div class="info-section">
      <div class="info-section-title">库存信息</div>
      <div class="info-section-body">
        <div class="cds-data-row"><span class="cds-data-label">库存状态</span><span class="cds-data-value"><span class="inv-status-badge ${STATUS_MAP[d.invStatus] || ''}">${d.invStatus}</span></span></div>
        <div class="cds-data-row"><span class="cds-data-label">库位</span><span class="cds-data-value">${d.storageDesc}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">供应商</span><span class="cds-data-value">${d.supplier}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">最近入库</span><span class="cds-data-value">${d.lastIn}</span></div>
        <div class="cds-data-row"><span class="cds-data-label">库存金额</span><span class="cds-data-value mono">¥${(d.qty*d.unitPrice).toLocaleString()}</span></div>
      </div>
    </div>
    ${d.qty <= 0 ? '<div style="margin:0 16px;padding:14px;background:#fff1f0;color:#da1e28;font-size:13px;border-left:3px solid #da1e28;">该物料已缺货，请尽快采购补货。安全库存为 ' + d.safetyStock + ' ' + d.unit + '。</div>'
    : d.qty < d.safetyStock ? '<div style="margin:0 16px;padding:14px;background:#fcf4d6;color:#8e6a00;font-size:13px;border-left:3px solid #f1c21b;">库存数量('+d.qty+')低于安全库存('+d.safetyStock+')，建议及时补货。</div>' : ''}
    <div class="detail-back-btn">
      <button class="cds-btn-secondary" onclick="backToInvList()">返回列表</button>
    </div>`;
}

function backToInvList() {
  document.getElementById('invDetailView').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('invResultList').style.display = 'block';
  document.getElementById('invCountBar').style.display = 'flex';
  document.getElementById('invSearchBar').style.display = 'grid';
}

// ========================================================================
//  Fault Code Page — 3-level Tree: 目录类型 → 代码组 → 代码
// ========================================================================
function renderFCTree() {
  const tree = buildFaultTree();
  document.getElementById('fcDetailView').style.display = 'none';
  const fcTree = document.getElementById('fcTree');
  fcTree.style.display = 'block';
  fcTree.innerHTML = tree.map((cat, ci) => {
    const totalCodes = cat.groups.reduce((s,g) => s + g.codes.length, 0);
    return `<div class="fc-cat-block" id="fc-cat-${ci}">
      <div class="fc-tree-cat" onclick="toggleFCCat(${ci})">
        <span class="tree-arrow">▶</span>
        <span>${cat.category}故障</span>
        <span class="tree-count">${cat.groups.length}组 ${totalCodes}条</span>
      </div>
      <div class="fc-children" id="fc-cat-children-${ci}">
        ${cat.groups.map((g, gi) => `
          <div class="fc-group-block" id="fc-group-${ci}-${gi}">
            <div class="fc-tree-group" onclick="event.stopPropagation(); toggleFCGroup(${ci},${gi})">
              <span class="tree-arrow">▶</span>
              <span>${g.name}</span>
            </div>
            <div class="fc-children" id="fc-group-children-${ci}-${gi}">
              ${g.codes.map(fc => `
                <div class="fc-tree-leaf" onclick="event.stopPropagation(); showFCDetail('${fc.id}')">
                  <span class="leaf-dot"></span>
                  <span class="leaf-code">${fc.code}</span>
                  <span class="leaf-name">${fc.name}</span>
                  <span class="leaf-arrow">›</span>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleFCCat(ci) {
  const catEl = document.querySelector(`#fc-cat-${ci} .fc-tree-cat`);
  const children = document.getElementById(`fc-cat-children-${ci}`);
  const isOpen = children.classList.toggle('open');
  if (isOpen) catEl.classList.add('expanded');
  else catEl.classList.remove('expanded');
}

function toggleFCGroup(ci, gi) {
  const groupEl = document.querySelector(`#fc-group-${ci}-${gi} .fc-tree-group`);
  const children = document.getElementById(`fc-group-children-${ci}-${gi}`);
  const isOpen = children.classList.toggle('open');
  if (isOpen) groupEl.classList.add('expanded');
  else groupEl.classList.remove('expanded');
}

function showFCDetail(id) {
  const d = faultCodeData.find(f => f.id === id);
  if (!d) return;
  document.getElementById('fcDetailView').style.display = 'block';
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('backBtn').setAttribute('onclick', 'goBack()');
  document.getElementById('fcTree').style.display = 'none';
  document.getElementById('deviceDetailArea').innerHTML = '';

  const steps = d.suggestion.split('\n').filter(s => s.trim());
  const solveSteps = steps.map((s,i) =>
    `<div class="fc-solve-step"><span class="fc-solve-num">${i+1}</span><span>${s.replace(/^\d+\.\s*/, '')}</span></div>`
  ).join('');

  document.getElementById('fcDetailView').innerHTML = `
    <div style="padding:20px 16px 0;">
      <div class="mono" style="font-size:20px;font-weight:600;color:var(--cds-red-60);">${d.code}</div>
      <div style="font-size:26px;font-weight:300;margin:4px 0 8px;">${d.name}</div>
      <span class="cds-tag cds-tag--blue" style="margin-bottom:8px;display:inline-block;">${d.categoryType}故障</span><span class="cds-tag cds-tag--outline" style="margin-left:6px;margin-bottom:8px;display:inline-block;">${d.group}</span>
    </div>

    <div class="fc-section" style="margin-top:8px;">
      <div class="fc-section-header"><span class="fc-section-icon icon-phenom">⚡</span>故障现象</div>
      <div class="fc-section-body">${d.phenomenon}</div>
    </div>

    <div class="fc-section">
      <div class="fc-section-header"><span class="fc-section-icon icon-cause">⚠</span>故障原因</div>
      <div class="fc-section-body">${(d.cause||'').replace(/\n/g, '<br>')}</div>
    </div>

    <div class="fc-section">
      <div class="fc-section-header"><span class="fc-section-icon icon-solve">✓</span>解决措施</div>
      <div class="fc-section-body" style="padding-top:8px;">${solveSteps}</div>
    </div>

    <div class="info-section" style="margin-top:8px;">
      <div class="info-section-title">📘 关联经验（${d.experiences.length}条）</div>
      <div class="info-section-body" style="padding-bottom:12px;">
        ${d.experiences.map(e => `<div class="exp-block">
          <div class="exp-meta">👤 ${e.author} · 📅 ${e.date}</div>
          <div>${e.content}</div>
        </div>`).join('')}
      </div>
    </div>

    <div style="text-align:center;padding:12px 16px 32px;">
      <button class="cds-btn-secondary" onclick="backToFCList()" style="width:100%;">← 返回故障代码</button>
    </div>`;
}

function backToFCList() {
  document.getElementById('fcDetailView').style.display = 'none';
  document.getElementById('backBtn').style.display = 'flex';
  document.getElementById('backBtn').setAttribute('onclick', 'goBack()');
  document.getElementById('fcTree').style.display = 'block';
  document.getElementById('deviceDetailArea').innerHTML = '';
  renderFCTree();
}
